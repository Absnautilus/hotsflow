name: Production migration mechanism — E2E test (disposable only, no real systems)

# Manual only, NO confirm_project_ref gate needed and self-triggerable --
# every credential and every database here is disposable, created fresh
# by this workflow and destroyed with the runner at job end. Never
# touches the real legacy or Hotsflow projects, never touches Vercel,
# never creates real secrets.
#
# "legacy-sim" is a plain Postgres service container seeded with a
# schema-shape double of legacy's public tables (see
# scripts/production/e2e-test/seed_legacy_sim.sql) -- deliberately not a
# full Supabase stack on that side, since triggers/RLS/functions are out
# of scope for testing the migration MECHANISM (already covered
# elsewhere). "target-sim" is a full local Supabase stack (same
# mechanism dry-run-migration.yml/rehearsal-migration.yml/
# freeze-rehearsal.yml already use), needed because Auth migration must
# exercise the real GoTrue Admin API.
#
# Two separate canary values (see scripts/production/e2e-test/seed_legacy_sim.sql
# for the full rationale):
#   - RUN_CANARY: random per-run string, used only for the hotel's own
#     name (a business label, not PII -- expected in HOTEL_NAME env,
#     command echoes, reconciliation output).
#   - PII_CANARY: a fixed literal (defined once below and inside
#     seed_legacy_sim.sql), planted ONLY in the fields that stand in for
#     real PII -- staff name, login_username, auth.users.email,
#     stays.guest_last_name. Never passed as a `-v` argument and never
#     referenced via a `${{ }}` expression anywhere in this file, so it
#     can never end up on a command line or in a step's env: echo --
#     every place that needs it at runtime (the auth-collision injection,
#     the rollback check) reads it back out of legacy-sim into a shell
#     variable instead.
#
# The `canary-log-scan` job below is the real, automated proof: it runs
# after both jobs finish, downloads each one's COMPLETE log via the
# GitHub API, and fails the workflow if the PII_CANARY literal appears
# even once. This replaces an earlier version of this comment that
# described this check as something a human/agent would do by hand after
# the fact -- it is now an enforced step of the workflow itself.
#
# PII_CANARY is deliberately NOT declared in any workflow/job/step `env:`
# block (unlike RUN_CANARY's HOTEL_NAME use) -- env: blocks get echoed
# into every step's "Run ..." log preamble regardless of whether that
# step actually uses the value, which would defeat the whole point. The
# literal `zzpiicanary7f2e9b4a1c` is instead written directly, in full,
# only inside scripts/production/e2e-test/seed_legacy_sim.sql (checked-in
# source, not a command-line argument) and inside the two `run:` scripts
# below that need to compare against it -- both of which read the value
# back at runtime via a database query into a shell variable, never via
# a `${{ }}` expression, so the resolved value itself is never echoed.
#
# PRE-FLIGHT #14 redesign: migration_readonly no longer receives any
# grant on the auth schema at all (found, on the real legacy project, not
# to take effect -- that schema is owned by supabase_admin). Each job now
# runs scripts/production/create_migration_auth_lookup.sql on legacy-sim
# right after creating the role, mirroring the real setup order exactly
# -- the view must be created after the role exists, since it grants
# SELECT on itself to migration_readonly. 02_export_legacy.sql reads
# staff email through this view, never through auth.users directly, so
# this step is required for the orchestrator run further down to
# succeed, not just cosmetic.
on:
  workflow_dispatch:

jobs:
  happy-path:
    runs-on: ubuntu-latest
    services:
      legacy-sim:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: legacysimadminpw
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canary string
        id: canary
        run: echo "value=zzc$(date +%s)$RANDOM" >> "$GITHUB_OUTPUT"

      - name: Seed legacy-sim (canary-tagged synthetic data)
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          psql "postgresql://postgres@localhost:5433/postgres" -v ON_ERROR_STOP=1 \
            -v canary="${{ steps.canary.outputs.value }}" \
            -f scripts/production/e2e-test/seed_legacy_sim.sql

      - name: Create migration_readonly role on legacy-sim
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          psql "postgresql://postgres@localhost:5433/postgres" -v ON_ERROR_STOP=1 \
            -v role_password="e2e-test-readonly-pw" \
            -f scripts/production/setup_readonly_role.sql

      - name: Create migration_readonly_auth_lookup view on legacy-sim (PRE-FLIGHT #14 redesign)
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          psql "postgresql://postgres@localhost:5433/postgres" -v ON_ERROR_STOP=1 \
            -f scripts/production/create_migration_auth_lookup.sql

      - name: Active read-only enforcement test (must be REJECTED)
        run: |
          set +e
          PGPASSWORD=e2e-test-readonly-pw psql "postgresql://migration_readonly@localhost:5433/postgres" \
            -c "insert into hotels values ('deadbeef-0000-0000-0000-000000000001','should not be allowed','Europe/Rome',true);"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "!!! FAIL: read-only role was able to write. Aborting."
            exit 1
          fi
          echo ">>> read_only_enforcement: PASS (write correctly rejected, exit code $RC)"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start target-sim (local Supabase stack)
        run: |
          supabase start
          supabase db reset

      - name: Run production migration orchestrator against legacy-sim -> target-sim
        env:
          LEGACY_RO_DB_URL: postgresql://migration_readonly:e2e-test-readonly-pw@localhost:5433/postgres
          LEGACY_HOTEL_ID: cccccccc-0000-0000-0000-000000000001
          HOTEL_NAME: "ZZCANARY_HOTEL_${{ steps.canary.outputs.value }}"
          HOTEL_SLUG: "zzcanary-e2e-test"
        run: |
          STATUS_JSON="$(supabase status -o json)"
          TARGET_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          TARGET_API_URL="$(echo "$STATUS_JSON" | jq -r '.API_URL')"
          TARGET_SERVICE_ROLE_KEY="$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')"
          export TARGET_DB_URL TARGET_API_URL TARGET_SERVICE_ROLE_KEY
          chmod +x scripts/production/orchestrate_production_migration.sh scripts/production/05_auth_migrate.sh
          scripts/production/orchestrate_production_migration.sh

      - name: Verify workspace was removed
        run: |
          if [ -d "${RUNNER_TEMP}/migration-workspace" ]; then
            echo "!!! FAIL: workspace still exists after orchestrator run"
            exit 1
          fi
          echo ">>> workspace_cleanup: PASS"

      - name: Idempotency / hard-gate test — rerun MUST be blocked
        env:
          LEGACY_RO_DB_URL: postgresql://migration_readonly:e2e-test-readonly-pw@localhost:5433/postgres
          LEGACY_HOTEL_ID: cccccccc-0000-0000-0000-000000000001
          HOTEL_NAME: "ZZCANARY_HOTEL_${{ steps.canary.outputs.value }}"
          HOTEL_SLUG: "zzcanary-e2e-test"
        run: |
          STATUS_JSON="$(supabase status -o json)"
          TARGET_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          TARGET_API_URL="$(echo "$STATUS_JSON" | jq -r '.API_URL')"
          TARGET_SERVICE_ROLE_KEY="$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')"
          export TARGET_DB_URL TARGET_API_URL TARGET_SERVICE_ROLE_KEY
          set +e
          scripts/production/orchestrate_production_migration.sh
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "!!! FAIL: rerun against an already-migrated hotel was NOT blocked"
            exit 1
          fi
          echo ">>> hard_gate_rerun: PASS (rerun correctly refused, exit code $RC)"

  auth-failure-injection:
    runs-on: ubuntu-latest
    services:
      legacy-sim:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: legacysimadminpw
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canary string
        id: canary
        run: echo "value=zzcfail$(date +%s)$RANDOM" >> "$GITHUB_OUTPUT"

      - name: Seed legacy-sim (canary-tagged synthetic data)
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          psql "postgresql://postgres@localhost:5433/postgres" -v ON_ERROR_STOP=1 \
            -v canary="${{ steps.canary.outputs.value }}" \
            -f scripts/production/e2e-test/seed_legacy_sim.sql

      - name: Create migration_readonly role on legacy-sim
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          psql "postgresql://postgres@localhost:5433/postgres" -v ON_ERROR_STOP=1 \
            -v role_password="e2e-test-readonly-pw" \
            -f scripts/production/setup_readonly_role.sql

      - name: Create migration_readonly_auth_lookup view on legacy-sim (PRE-FLIGHT #14 redesign)
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          psql "postgresql://postgres@localhost:5433/postgres" -v ON_ERROR_STOP=1 \
            -f scripts/production/create_migration_auth_lookup.sql

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start target-sim (local Supabase stack)
        run: |
          supabase start
          supabase db reset

      - name: Pre-create a colliding Auth user on target-sim (forces the 2nd creation to fail)
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          # Reads the email straight out of legacy-sim into a shell variable
          # -- never via a GitHub expression interpolation -- so the
          # PII-shaped value is never resolved into this step's echoed
          # command text. The query TEXT below (id = a fixed, non-PII
          # synthetic UUID) is all that's ever visible in the log.
          COLLIDE_EMAIL="$(psql "postgresql://postgres@localhost:5433/postgres" -tAc \
            "select email from auth.users where id = 'cccccccc-0000-0000-0000-0000000000a2'")"
          STATUS_JSON="$(supabase status -o json)"
          API_URL="$(echo "$STATUS_JSON" | jq -r '.API_URL')"
          SERVICE_ROLE_KEY="$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')"
          PAYLOAD="$(jq -n --arg email "$COLLIDE_EMAIL" '{email: $email, password: "Collision!234", email_confirm: true}')"
          curl -s -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "User-Agent: migration-script/1.0" \
            -d "$PAYLOAD" >/dev/null

      - name: Run orchestrator — MUST fail at Auth migration and roll back
        env:
          LEGACY_RO_DB_URL: postgresql://migration_readonly:e2e-test-readonly-pw@localhost:5433/postgres
          LEGACY_HOTEL_ID: cccccccc-0000-0000-0000-000000000001
          HOTEL_NAME: "ZZCANARY_HOTEL_${{ steps.canary.outputs.value }}"
          HOTEL_SLUG: "zzcanary-e2e-fail-test"
        run: |
          STATUS_JSON="$(supabase status -o json)"
          TARGET_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          TARGET_API_URL="$(echo "$STATUS_JSON" | jq -r '.API_URL')"
          TARGET_SERVICE_ROLE_KEY="$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')"
          export TARGET_DB_URL TARGET_API_URL TARGET_SERVICE_ROLE_KEY
          chmod +x scripts/production/orchestrate_production_migration.sh scripts/production/05_auth_migrate.sh
          set +e
          scripts/production/orchestrate_production_migration.sh > "$RUNNER_TEMP/orchestrator.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/orchestrator.log"

          # Non-PII markers already printed by the orchestrator/05_auth_migrate.sh
          # (structural stage labels + counts, never row content) -- asserting on
          # them in order is the only way to know the failure happened at the
          # intended Auth collision, not somewhere earlier in the pipeline. A
          # bare RC != 0 check can't tell those apart (this caught the previous
          # run: VALIDATION itself was failing, and RC != 0 alone made that look
          # like a pass).
          if [ "$RC" -eq 0 ]; then
            echo "!!! FAIL: orchestrator succeeded despite the forced Auth collision"
            exit 1
          fi
          if ! grep -qF "=== 3. VALIDATION" "$RUNNER_TEMP/orchestrator.log" || ! grep -qF "VALIDATION: 0 anomalies." "$RUNNER_TEMP/orchestrator.log"; then
            echo "!!! FAIL: VALIDATION was not reached / did not pass -- failure happened before the intended collision point"
            exit 1
          fi
          if ! grep -qF "=== 4. EXPORT" "$RUNNER_TEMP/orchestrator.log" || ! grep -qF "Export complete:" "$RUNNER_TEMP/orchestrator.log"; then
            echo "!!! FAIL: EXPORT was not reached / did not complete -- failure happened before the intended collision point"
            exit 1
          fi
          if ! grep -qF "=== 6. AUTH MIGRATION" "$RUNNER_TEMP/orchestrator.log"; then
            echo "!!! FAIL: the AUTH MIGRATION phase was never reached"
            exit 1
          fi
          if ! grep -qF "Auth user creation failed" "$RUNNER_TEMP/orchestrator.log" || ! grep -qF ">>> auth_migration: FAIL" "$RUNNER_TEMP/orchestrator.log"; then
            echo "!!! FAIL: AUTH MIGRATION was reached but did not fail with the expected marker -- not proven to be the injected collision"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/orchestrator.log"
          echo ">>> auth_failure_triggered: PASS (VALIDATION passed, EXPORT completed, AUTH MIGRATION reached and failed at the injected collision, orchestrator exited nonzero: $RC)"

      - name: Verify rollback — no hotel, no auth_remap rows, orphaned Auth user deleted
        env:
          PGPASSWORD: legacysimadminpw
        run: |
          # Same pattern as the collision-injection step: the master's
          # email is read from legacy-sim into a shell variable at
          # runtime, never via a GitHub expression interpolation.
          MASTER_EMAIL="$(psql "postgresql://postgres@localhost:5433/postgres" -tAc \
            "select email from auth.users where id = 'cccccccc-0000-0000-0000-0000000000a1'")"
          STATUS_JSON="$(supabase status -o json)"
          API_URL="$(echo "$STATUS_JSON" | jq -r '.API_URL')"
          SERVICE_ROLE_KEY="$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')"
          HOTEL_COUNT="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from hotels where id = 'cccccccc-0000-0000-0000-000000000001'")"
          REMAP_COUNT="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from auth_remap" 2>/dev/null || echo 0)"
          MASTER_STILL_EXISTS="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from auth.users where email = '$MASTER_EMAIL'")"
          echo "hotel_count=$HOTEL_COUNT auth_remap_count=$REMAP_COUNT master_auth_user_remaining=$MASTER_STILL_EXISTS"
          if [ "$HOTEL_COUNT" != "0" ] || [ "$REMAP_COUNT" != "0" ] || [ "$MASTER_STILL_EXISTS" != "0" ]; then
            echo "!!! FAIL: rollback left residue (hotel/auth_remap/orphaned Auth user)"
            exit 1
          fi
          echo ">>> auth_failure_rollback: PASS (0 hotel rows, 0 auth_remap rows, orphaned Auth user cleaned up)"

      - name: Verify workspace was removed
        run: |
          if [ -d "${RUNNER_TEMP}/migration-workspace" ]; then
            echo "!!! FAIL: workspace still exists after a failed run"
            exit 1
          fi
          echo ">>> workspace_cleanup_on_failure: PASS"

  # Real, automated proof that no PII-shaped data reached a log -- not an
  # assumption, not a partial manual eyeball. Runs after both jobs finish
  # (success or failure, via if: always()) and downloads each one's
  # COMPLETE log through the GitHub API, then greps it for the exact
  # PII_CANARY literal that seed_legacy_sim.sql plants only in
  # staff_profiles.name/login_username, auth.users.email and
  # stays.guest_last_name. The RUN_CANARY (used for HOTEL_NAME) is
  # deliberately NOT checked here -- it is expected to appear (see the
  # header comment above) and checking for it would only reproduce the
  # earlier, invalid version of this test.
  canary-log-scan:
    runs-on: ubuntu-latest
    needs: [happy-path, auth-failure-injection]
    if: always()
    permissions:
      actions: read
    steps:
      - name: Download complete job logs and grep for the PII canary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PII_CANARY="zzpiicanary7f2e9b4a1c"
          FAIL=0
          JOBS_JSON="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
          for JOB_NAME in "happy-path" "auth-failure-injection"; do
            JOB_ID="$(echo "$JOBS_JSON" | jq -r --arg name "$JOB_NAME" '.jobs[] | select(.name == $name) | .id' | head -1)"
            if [ -z "$JOB_ID" ]; then
              echo "!!! FAIL: could not resolve job id for '$JOB_NAME' in this run"
              FAIL=1
              continue
            fi
            echo "=== scanning job '$JOB_NAME' (id=$JOB_ID) ==="
            curl -sS -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$JOB_ID/logs" -o "/tmp/${JOB_NAME}.log"
            OCCURRENCES="$(grep -c -F -- "$PII_CANARY" "/tmp/${JOB_NAME}.log" || true)"
            OCCURRENCES="${OCCURRENCES:-0}"
            echo ">>> PII_CANARY occurrences in '$JOB_NAME' complete log: $OCCURRENCES"
            if [ "$OCCURRENCES" != "0" ]; then
              echo "!!! FAIL: PII canary leaked into '$JOB_NAME' log -- offending line numbers:"
              grep -n -F -- "$PII_CANARY" "/tmp/${JOB_NAME}.log" | cut -d: -f1
              FAIL=1
            fi
            rm -f "/tmp/${JOB_NAME}.log"
          done
          if [ "$FAIL" != "0" ]; then
            echo "!!! PII canary leak test FAILED"
            exit 1
          fi
          echo ">>> PII_CANARY occurrences in complete logs = 0 (happy-path + auth-failure-injection)"
