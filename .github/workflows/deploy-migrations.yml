name: Deploy migrations to shared Supabase project

# Manual only, on purpose: this deploys hotsflow-core/supabase/migrations/ —
# the single source of truth for the platform's shared database (Fase 2,
# Decision 4) — to the real hosted project. Never triggers automatically on
# push. `mode: check` is read-only (safe to run anytime); `mode: apply`
# requires typing the target project ref as an extra confirmation gate.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only migration list only; apply = push pending migrations"
        required: true
        type: choice
        options:
          - check
          - apply
        default: check
      confirm_project_ref:
        description: "Type the target Supabase project ref to confirm (must match the SUPABASE_PROJECT_REF repo variable exactly)"
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target project ref matches expectation
        run: |
          if [ "${{ inputs.confirm_project_ref }}" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::confirm_project_ref ('${{ inputs.confirm_project_ref }}') does not match the configured SUPABASE_PROJECT_REF repo variable — refusing to proceed."
            exit 1
          fi
          echo "Target project ref confirmed: ${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migration status (read-only, always runs)
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Apply pending migrations
        if: inputs.mode == 'apply'
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration up --db-url "$SUPABASE_DB_URL"

      - name: Migration status after apply
        if: inputs.mode == 'apply'
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
