name: Diagnose legacy RLS visibility (read-only, no fix applied)

# Manual only, diagnosis-only. Explains the PRE-FLIGHT #14 FAIL (0 rows
# visible on hotels) by reading RLS status and policy definitions from
# pg_class/pg_policies -- catalog metadata, not row content from the 7
# migration tables. Uses ONLY the LEGACY_DB_URL_READONLY secret already
# verified in verify-legacy-readonly-credential.yml -- no Hotsflow
# secret/variable referenced anywhere in this file. Applies no fix: no
# BYPASSRLS grant, no RLS disable, no policy change, no write of any
# kind.
on:
  workflow_dispatch:
    inputs:
      confirm_legacy_project_ref:
        description: "Type the legacy Housekeeping project ref to confirm: bqurkxmkqviewzbndldh"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation matches the expected legacy project ref
        run: |
          if [ "${{ inputs.confirm_legacy_project_ref }}" != "bqurkxmkqviewzbndldh" ]; then
            echo "::error::confirm_legacy_project_ref does not match -- refusing to proceed."
            exit 1
          fi
          echo "Confirmed: targeting legacy Housekeeping project bqurkxmkqviewzbndldh."

      - uses: actions/checkout@v4

      - name: RLS diagnosis (catalog metadata only, no fix applied)
        env:
          LEGACY_RO_DB_URL: ${{ secrets.LEGACY_DB_URL_READONLY }}
        run: |
          if [ -z "$LEGACY_RO_DB_URL" ]; then
            echo "::error::LEGACY_DB_URL_READONLY secret is not set."
            exit 1
          fi
          psql "$LEGACY_RO_DB_URL" -v ON_ERROR_STOP=1 -f scripts/production/diagnose_rls.sql
