name: Pre-cutover PRE-FLIGHT (strictly read-only)

# Manual only, confirm_project_ref-gated like deploy-migrations.yml and
# verify-cutover-readiness.yml. Unlike verify-cutover-readiness.yml, this
# workflow writes NOTHING -- every step is a read-only listing or SELECT
# against the real Hotsflow project. Intended to be run immediately
# before FREEZE, as the read-only half of the runbook's §2 checklist
# (items 1-3, 8, 9's deployment-status half, 10, 11's static/signal half,
# 13, plus the two extra "nothing real has landed yet" checks added for
# this pre-flight pass). It does not fire a new webhook test (that writes
# temporary synthetic rows, out of scope for a read-only pass) and it
# does not touch Vercel, Auth config, or any secret.
on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the target Supabase project ref to confirm (must match the SUPABASE_PROJECT_REF repo variable exactly)"
        required: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target project ref matches expectation
        run: |
          if [ "${{ inputs.confirm_project_ref }}" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::confirm_project_ref does not match the configured SUPABASE_PROJECT_REF repo variable -- refusing to proceed."
            exit 1
          fi
          echo "Target project ref confirmed: ${{ vars.SUPABASE_PROJECT_REF }}"

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 1-2-3. CI status is checked outside this workflow (GitHub Actions API); migration/schema history
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: 9. Edge Functions deployment status (list only, no invocation)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: 8, 10, 11, 13, 14, 15 -- read-only SQL checks
        env:
          DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: psql "$DB_URL" -f scripts/verify/preflight_readonly.sql
