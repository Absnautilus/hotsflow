name: Verify LEGACY_DB_URL_READONLY credential (non-destructive, no PII)

# Manual only. One-off confirmation that the migration_readonly
# credential on the real legacy Housekeeping project (PRE-FLIGHT #14) is
# what it's supposed to be, before any FREEZE/export/migration is
# authorized. Uses ONLY the LEGACY_DB_URL_READONLY secret -- no Hotsflow
# secret or variable is referenced anywhere in this file, so there is no
# path by which this workflow could read or write anything on the target
# project. verify_readonly_credential.sql (updated for the PRE-FLIGHT #14
# view-based redesign) never queries auth.users directly and never
# prints an email/name/username -- only counts, booleans, and column
# names. No write is attempted.
on:
  workflow_dispatch:
    inputs:
      confirm_legacy_project_ref:
        description: "Type the legacy Housekeeping project ref to confirm: bqurkxmkqviewzbndldh"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation matches the expected legacy project ref
        run: |
          if [ "${{ inputs.confirm_legacy_project_ref }}" != "bqurkxmkqviewzbndldh" ]; then
            echo "::error::confirm_legacy_project_ref does not match -- refusing to proceed."
            exit 1
          fi
          echo "Confirmed: targeting legacy Housekeeping project bqurkxmkqviewzbndldh."

      - uses: actions/checkout@v4

      - name: Non-destructive credential verification (metadata/privilege introspection only)
        env:
          LEGACY_RO_DB_URL: ${{ secrets.LEGACY_DB_URL_READONLY }}
        run: |
          if [ -z "$LEGACY_RO_DB_URL" ]; then
            echo "::error::LEGACY_DB_URL_READONLY secret is not set."
            exit 1
          fi
          psql "$LEGACY_RO_DB_URL" -v ON_ERROR_STOP=1 -f scripts/production/verify_readonly_credential.sql
