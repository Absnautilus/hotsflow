name: Verify auth lookup view was created correctly (non-destructive, no PII)

# Manual only. Narrow, one-off structural/ACL check that
# create_migration_auth_lookup.sql produced exactly the object it
# should on the real legacy project -- distinct from the full
# PRE-FLIGHT #14 gate (verify-legacy-readonly-credential.yml), not a
# re-run of it. Uses ONLY the LEGACY_DB_URL_READONLY secret -- these are
# all catalog/metadata queries, readable by any authenticated role, no
# admin credential needed. No Hotsflow secret or variable is referenced
# anywhere in this file. No view content, email, name, or username is
# ever read or printed.
on:
  workflow_dispatch:
    inputs:
      confirm_legacy_project_ref:
        description: "Type the legacy Housekeeping project ref to confirm: bqurkxmkqviewzbndldh"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation matches the expected legacy project ref
        run: |
          if [ "${{ inputs.confirm_legacy_project_ref }}" != "bqurkxmkqviewzbndldh" ]; then
            echo "::error::confirm_legacy_project_ref does not match -- refusing to proceed."
            exit 1
          fi
          echo "Confirmed: targeting legacy Housekeeping project bqurkxmkqviewzbndldh."

      - uses: actions/checkout@v4

      - name: Structural verification of the auth lookup view (metadata/ACL introspection only)
        env:
          LEGACY_RO_DB_URL: ${{ secrets.LEGACY_DB_URL_READONLY }}
        run: |
          if [ -z "$LEGACY_RO_DB_URL" ]; then
            echo "::error::LEGACY_DB_URL_READONLY secret is not set."
            exit 1
          fi
          psql "$LEGACY_RO_DB_URL" -v ON_ERROR_STOP=1 -f scripts/production/verify_auth_lookup_view_created.sql
